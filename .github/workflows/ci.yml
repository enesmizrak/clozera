name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: backend/.node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      TEST_MONGODB_CONNECTION_STRING: mongodb://localhost:27017/clozera-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: backend/.node-version
          cache: npm
      - run: npm ci
      - run: npm run test:integration
