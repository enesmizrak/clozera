services:
  frontend:
    image: clozera-frontend:dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - '5173:5173'
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./packages/shared/src:/app/packages/shared/src
    environment:
      NODE_ENV: development
      # The web server proxies /api to the API container and calls it directly during SSR.
      API_INTERNAL_URL: http://api:3000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').connect(5173, '127.0.0.1').on('connect', function () { this.end(); process.exit(0) }).on('error', function () { process.exit(1) })",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api:
    image: clozera-api:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./backend/src:/app/backend/src
      - ./packages/shared/src:/app/packages/shared/src
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_CONNECTION_STRING: mongodb://mongodb:27017/clozera
      # Development email goes to Mailpit, never to real inboxes: http://localhost:8025
      EMAIL_TRANSPORT: smtp
      SMTP_URL: smtp://mailpit:1025
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready', { signal: AbortSignal.timeout(3000) }).then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  mongodb:
    image: mongo:8.0
    pull_policy: always
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb80-data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Local mail catcher. SMTP on 1025, inbox UI on http://localhost:8025. Messages are not persisted.
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  mongodb80-data:
